name: Flutter CI & Contract Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify clean codegen (no uncommitted freezed/g.dart diffs)
        run: git diff --exit-code -- '*.freezed.dart' '*.g.dart'
      # Lưu ý: dùng `flutter analyze` thay `--fatal-infos` vì Flutter 3.50
      # đánh dấu deprecated_member_use ở mức info cho material.dart.
      - run: flutter analyze
      - run: flutter test
